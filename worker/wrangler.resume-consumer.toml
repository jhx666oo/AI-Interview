name = "ai-interview-resume-consumer"
main = "src/resume-consumer.ts"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "ai-interview-db"
database_id = "3f82993e-210d-4b0b-9d83-4ed4be69724f"

[[queues.producers]]
binding = "RESUME_PROCESSING_QUEUE"
queue = "resume-processing"

[[queues.consumers]]
queue = "resume-processing"
max_batch_size = 1
max_batch_timeout = 5
max_concurrency = 3

# 简历 PDF 存储（KV，consumer OCR 读取用）
[[kv_namespaces]]
binding = "RESUMES_KV"
id = "5da86e31124d49909ef2e5adfcd3f0d1"
