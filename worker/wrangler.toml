name = "ai-interview-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# 仪表盘 v3 的两张独立招聘数据源（表 ID 非敏感；用户身份仍通过 OAuth token 读取）
[vars]
FEISHU_DASHBOARD_ZHIPEI_APP_TOKEN = "QivHbbd6JaAV0fs0LDqcZEc3n4g"
FEISHU_DASHBOARD_ZHIPEI_TABLE_ID = "tbl0yOiT0XarJwf9"
FEISHU_DASHBOARD_ZHIPEI_VIEW_ID = "vew2ViJain"
FEISHU_DASHBOARD_YANGLAO_APP_TOKEN = "Z0X7bzVHoaE4essOK1tc7Xcencb"
FEISHU_DASHBOARD_YANGLAO_TABLE_ID = "tbl4UKBczcKlKgtk"
FEISHU_DASHBOARD_YANGLAO_VIEW_ID = "vew33IcH5s"
# 面试自动化灰度总开关：保持关闭，完成预览和数据审计后再按岗位开启。
INTERVIEW_AUTOMATION_ENABLED = "false"

# ⚠️ 敏感配置请通过 `npx wrangler secret put` 设置，不要直接写在文件里
# 已通过 wrangler secret 或 Dashboard 环境变量设置的配置：
#   SECRET_KEY, FEISHU_APP_ID, FEISHU_APP_SECRET, FEISHU_BITABLE_APP_TOKEN
#   FEISHU_REQUISITION_TABLE_ID, FEISHU_POSITION_TABLE_ID
#   FEISHU_ZHIPEI_RECRUITMENT_TABLE_ID, FEISHU_YANGLAO_RECRUITMENT_TABLE_ID
#     （仪表盘 v3 的两张招聘明细表；未设置时兼容回退到上面两个旧变量）
#   FEISHU_DASHBOARD_USER_EMAIL（系统 users.email，例如 admin@example.com；不是飞书资料邮箱）
#   FEISHU_DASHBOARD_ZHIPEI_APP_TOKEN, FEISHU_DASHBOARD_ZHIPEI_TABLE_ID, FEISHU_DASHBOARD_ZHIPEI_VIEW_ID
#   FEISHU_DASHBOARD_YANGLAO_APP_TOKEN, FEISHU_DASHBOARD_YANGLAO_TABLE_ID, FEISHU_DASHBOARD_YANGLAO_VIEW_ID
#     （仪表盘独立用户 OAuth 数据源；配置后仅仪表盘使用 user_access_token 读取这两张表）

# AI 配置（通过 `npx wrangler secret put` 设置）
#   AI_API_KEY — DeepSeek / 兼容 OpenAI API 的密钥
#   AI_BASE_URL — API 地址，默认 https://api.deepseek.com
# ✅ 已通过 wrangler secret 设置（DeepSeek）

[[d1_databases]]
binding = "DB"
database_name = "ai-interview-db"
database_id = "3f82993e-210d-4b0b-9d83-4ed4be69724f"

# 简历处理队列（与 resume-consumer 共用，本地 dev 模拟队列）
[[queues.producers]]
binding = "RESUME_PROCESSING_QUEUE"
queue = "resume-processing"

[[queues.producers]]
binding = "INTERVIEW_AUTOMATION_QUEUE"
queue = "interview-automation"

# Cron triggers - 北京时间 9:00 提醒待审核候选人；18:00（UTC 10:00）生成并推送日报；23:55 生成招聘看板快照
[triggers]
crons = ["*/5 * * * *", "0 1 * * *", "0 10 * * *", "55 15 * * *"]

# 简历 PDF 存储（KV，替代 D1 base64，避免 SQLITE_TOOBIG）
[[kv_namespaces]]
binding = "RESUMES_KV"
id = "5da86e31124d49909ef2e5adfcd3f0d1"
