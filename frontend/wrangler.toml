name = "ai-interview"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# 敏感密钥不放本文件（会入 git）：
#   生产环境：wrangler pages secret put SECRET_KEY / AI_API_KEY / FEISHU_APP_SECRET / CRON_SECRET
#   本地开发：frontend/.dev.vars（已 gitignore）
[vars]
AI_BASE_URL = "https://api.deepseek.com"

[[d1_databases]]
binding = "DB"
database_name = "ai-interview-db"
database_id = "3f82993e-210d-4b0b-9d83-4ed4be69724f"

# 注意：Cloudflare Pages 不支持 [triggers] crons（Workers 专属）
# 定时面试提醒改用 GitHub Actions 定时调用 POST /api/cron/interview-reminder
# 见 .github/workflows/interview-reminder-cron.yml

[ai]
binding = "AI"
