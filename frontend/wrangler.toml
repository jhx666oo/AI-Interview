name = "ai-interview"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# 敏感密钥不放本文件（会入 git）：
#   生产环境：wrangler pages secret put SECRET_KEY / AI_API_KEY / FEISHU_APP_SECRET / CRON_SECRET
#   本地开发：frontend/.dev.vars（已 gitignore）
[vars]
AI_BASE_URL = "https://api.deepseek.com"
# 仪表盘 v3 的两张独立招聘数据源（表/视图 ID 非敏感；访问仍使用 OAuth user token）
FEISHU_DASHBOARD_ZHIPEI_APP_TOKEN = "QivHbbd6JaAV0fs0LDqcZEc3n4g"
FEISHU_DASHBOARD_ZHIPEI_TABLE_ID = "tbl0yOiT0XarJwf9"
FEISHU_DASHBOARD_ZHIPEI_VIEW_ID = "vew2ViJain"
FEISHU_DASHBOARD_YANGLAO_APP_TOKEN = "Z0X7bzVHoaE4essOK1tc7Xcencb"
FEISHU_DASHBOARD_YANGLAO_TABLE_ID = "tbl4UKBczcKlKgtk"
FEISHU_DASHBOARD_YANGLAO_VIEW_ID = "vew33IcH5s"

[[d1_databases]]
binding = "DB"
database_name = "ai-interview-db"
database_id = "3f82993e-210d-4b0b-9d83-4ed4be69724f"

# 注意：Cloudflare Pages 不支持 [triggers] crons（Workers 专属）
# 定时面试提醒改用 GitHub Actions 定时调用 POST /api/cron/interview-reminder
# 见 .github/workflows/interview-reminder-cron.yml

[ai]
binding = "AI"

[[queues.producers]]
binding = "RESUME_PROCESSING_QUEUE"
queue = "resume-processing"

# 简历 PDF 存储（KV，替代 D1 base64，避免 SQLITE_TOOBIG）
[[kv_namespaces]]
binding = "RESUMES_KV"
id = "5da86e31124d49909ef2e5adfcd3f0d1"
