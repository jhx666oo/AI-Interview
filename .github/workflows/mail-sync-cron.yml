name: Mail Sync Cron

# 每 30 分钟从飞书邮箱抓取简历附件并上传到平台
# 凭据通过 GitHub Actions Secrets 注入，不入代码库
on:
  schedule:
    - cron: '*/30 * * * *'   # 每 30 分钟（UTC，即北京时间每 30 分钟）
  workflow_dispatch: {}       # 支持手动触发（测试用）

concurrency:
  group: mail-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mail-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run mail sync
        run: python scripts/mail_sync.py
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          API_BASE: https://ai-interview-88r.pages.dev
          SINCE_DAYS: 7
          MAX_EMAILS: 50
