name: Debug MAIL_USER secret
on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: 拆分输出 MAIL_USER（避免完整值被 GitHub 打码）
        run: |
          FULL="${{ secrets.MAIL_USER }}"
          echo "用户名(前缀): $(echo "$FULL" | sed 's/@.*//')"
          echo "域名(后缀): $(echo "$FULL" | sed 's/.*@//')"
          echo "长度: ${#FULL}"
          if [ -n "$FULL" ]; then echo "是否包含@: 是"; else echo "是否包含@: 否"; fi
