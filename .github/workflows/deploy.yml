name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-migrations:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Apply production D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply ai-interview-db --remote --config wrangler.jsonc

  frontend:
    name: Deploy Frontend (Pages)
    runs-on: ubuntu-latest
    needs: [database-migrations, worker-interview-automation-consumer]
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install worker dependencies（供 build-worker.cjs 用）
        run: npm ci
        working-directory: worker

      - name: Build frontend（含自动编译 _worker.js）
        run: npm run build
        working-directory: frontend

      - name: Run pre-deploy checks
        run: node scripts/pre-deploy-check.mjs

      - name: 验证构建产物（dist/_worker.js 与端点标记）
        # 排查"部署成功但 Functions 未生效"：确认 CI 构建的 _worker.js 真实存在且包含新端点
        working-directory: frontend
        run: |
          echo "## 构建产物检查" >> "$GITHUB_STEP_SUMMARY"
          ls -la dist/ | head -12 >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f dist/_worker.js ]; then
            echo "worker size: $(wc -c < dist/_worker.js)" >> "$GITHUB_STEP_SUMMARY"
            echo "has available-slots: $(grep -c available-slots dist/_worker.js || true)" >> "$GITHUB_STEP_SUMMARY"
            echo "has schedule-direct: $(grep -c schedule-direct dist/_worker.js || true)" >> "$GITHUB_STEP_SUMMARY"
            grep -q available-slots dist/_worker.js || { echo "❌ dist/_worker.js 缺失 available-slots，构建异常"; exit 1; }
          else
            echo "❌ dist/_worker.js 不存在！" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Ensure Pages production branch is main
        # 修复：wrangler pages deploy 只有命中项目 production branch 才会更新生产域名。
        # 直接调 Cloudflare Pages API 把 production_branch 强制设为 main，并校验响应成功
        # （若 token 缺 Pages 项目编辑权限，PATCH 会失败，此时必须显式报警）。
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          resp=$(curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/ai-interview" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}')
          echo "$resp" | head -c 800; echo
          echo "$resp" | grep -qE '"success"[[:space:]]*:[[:space:]]*true' \
            || { echo "❌ PATCH 设置 production_branch 失败（token 可能缺 Pages 项目编辑权限）"; exit 1; }
          echo "✅ production_branch 已确认"

      - name: Deploy to ai-interview
        # 脱离 wrangler-action 黑盒（Node 24 环境下 npx 调用不稳定，曾出现"成功但未生效"），
        # 直接 npx wrangler@3 直跑部署；tee+tail 保留完整日志的同时精简输出供排查，
        # 部署 URL 写入 job summary（run 页面可见、不截断）。
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@3.90.0 pages deploy dist --project-name ai-interview --branch main 2>&1 | tee /tmp/deploy.log | tail -30
          echo "## Deploy 结果" >> "$GITHUB_STEP_SUMMARY"
          grep -iE "deployment complete|peek over at|https://|error|fail" /tmp/deploy.log | head -8 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verify production health
        run: curl --fail --retry 3 --retry-delay 5 https://ai-interview-88r.pages.dev/health

      - name: 诊断 Pages 部署记录（定位 production 指向）
        # 列出该 Pages 项目全部部署，确认 production 是否指向本次 main 部署。
        # 放在探测之前执行，保证即使探测失败也能拿到部署记录用于定位；
        # 关键行写入 job summary（UI 日志截断时仍可读）。
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@3.90.0 pages deployment list --project-name ai-interview 2>&1 | tee /tmp/deplist.log | tail -40
          echo "## Pages 部署列表" >> "$GITHUB_STEP_SUMMARY"
          head -20 /tmp/deplist.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Verify production Functions 已更新（有效登录 token 探测 available-slots）
        # 全局 authMiddleware 会对 /api/* 直接返回 401，未认证探测无法区分版本；
        # 用 /api/auth/token 登录接口换取线上 SECRET_KEY 签发的有效 JWT（浏览器同款），
        # 请求新端点 available-slots：200=新版已生效；401/404 则部署未生效，失败报警。
        # 注意：登录接口 body 是 form-urlencoded（URLSearchParams），不是 JSON。
        env:
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "${ADMIN_PASSWORD}" ]; then
            echo "⚠️ 未配置 ADMIN_PASSWORD secret，跳过 Functions 版本探测"
            exit 0
          fi
          token=$(curl -s -m 30 -X POST "https://ai-interview-88r.pages.dev/api/auth/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=${ADMIN_EMAIL:-admin@example.com}&password=${ADMIN_PASSWORD}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(j.access_token||'')}catch(e){}})")
          if [ -z "$token" ]; then
            echo "❌ 登录换取 token 失败（请检查 secrets.ADMIN_PASSWORD / vars.ADMIN_EMAIL）"
            exit 1
          fi
          code=$(curl -s -o /tmp/avail.txt -w "%{http_code}" --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $token" \
            "https://ai-interview-88r.pages.dev/api/interviews/available-slots?interviewer=test")
          echo "available-slots(带有效JWT) HTTP $code"
          head -c 200 /tmp/avail.txt; echo
          if [ "$code" != "200" ]; then
            echo "❌ 生产 Functions 仍是旧版（expected 200），部署未生效，请检查 Cloudflare Pages 控制台"
            exit 1
          fi
          echo "✅ 生产 Functions 已包含新端点"

  worker-resume-consumer:
    name: Deploy Resume Consumer Worker
    runs-on: ubuntu-latest
    needs: database-migrations
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy resume-consumer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.resume-consumer.toml

  worker-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: [database-migrations, worker-interview-automation-consumer]
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.toml

  worker-interview-automation-consumer:
    name: Deploy Interview Automation Consumer
    runs-on: ubuntu-latest
    needs: database-migrations
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Deploy interview automation consumer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.interview-automation-consumer.toml
