name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-migrations:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Apply production D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply ai-interview-db --remote --config wrangler.jsonc

  frontend:
    name: Deploy Frontend (Pages)
    runs-on: ubuntu-latest
    needs: [database-migrations, worker-interview-automation-consumer]
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install worker dependencies（供 build-worker.cjs 用）
        run: npm ci
        working-directory: worker

      - name: Build frontend（含自动编译 _worker.js）
        run: npm run build
        working-directory: frontend

      - name: Run pre-deploy checks
        run: node scripts/pre-deploy-check.mjs

      - name: Ensure Pages production branch is main
        # 修复：wrangler pages deploy 只有命中项目 production branch 才会更新生产域名。
        # 直接调 Cloudflare Pages API 把 production_branch 强制设为 main
        # （wrangler pages project update 在部分版本语法不稳定，故用原生 API）。
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/ai-interview" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}'

      - name: Deploy to ai-interview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name ai-interview --branch main

      - name: Verify production health
        run: curl --fail --retry 3 --retry-delay 5 https://ai-interview-88r.pages.dev/health

      - name: Verify production Functions 已更新（新端点不得 404）
        # 历史问题：pages deploy 成功但生产 Functions 仍跑旧版。
        # available-slots 是新代码才有的路由；不带 token 请求应返回 401/400（JSON），
        # 若返回 404 说明线上 Functions 未生效，直接失败报警。
        run: |
          code=$(curl -s -o /tmp/avail.txt -w "%{http_code}" --retry 3 --retry-delay 5 \
            "https://ai-interview-88r.pages.dev/api/interviews/available-slots?interviewer=test")
          echo "available-slots HTTP $code"
          head -c 200 /tmp/avail.txt; echo
          if [ "$code" = "404" ]; then
            echo "❌ 生产 Functions 仍是旧版（available-slots 404），部署未生效，请检查 Cloudflare Pages 控制台"
            exit 1
          fi
          echo "✅ 生产 Functions 已包含新端点"

  worker-resume-consumer:
    name: Deploy Resume Consumer Worker
    runs-on: ubuntu-latest
    needs: database-migrations
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy resume-consumer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.resume-consumer.toml

  worker-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: [database-migrations, worker-interview-automation-consumer]
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.toml

  worker-interview-automation-consumer:
    name: Deploy Interview Automation Consumer
    runs-on: ubuntu-latest
    needs: database-migrations
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Deploy interview automation consumer
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.interview-automation-consumer.toml
